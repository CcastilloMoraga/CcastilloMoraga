<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Vassago" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2d0050" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#14002a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#050307" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e9ff"/>
      <stop offset="100%" stop-color="#b48ae0"/>
    </linearGradient>
    <style>
      .net line { stroke: #2d0050; stroke-width: 1; }
      .net circle { fill: #4a1a7a; }
      .pkt { stroke: #9966cc; stroke-width: 2; stroke-dasharray: 6 400; animation: flow 4s linear infinite; }
      .p2 { animation-delay: 1.3s; } .p3 { animation-delay: 2.6s; }
      .ghost-a { animation: glitchA 0.9s steps(2) 0.2s both; }
      .ghost-b { animation: glitchB 0.9s steps(2) 0.2s both; }
      .main { animation: rise 0.9s cubic-bezier(.2,.8,.2,1) both; }
      .sub { animation: fade 0.8s ease-out 0.8s both; }
      @keyframes flow { from { stroke-dashoffset: 406; } to { stroke-dashoffset: 0; } }
      @keyframes glitchA { 0%{transform:translate(-14px,0);opacity:.9} 60%{transform:translate(6px,0)} 100%{transform:translate(-3px,0);opacity:.55} }
      @keyframes glitchB { 0%{transform:translate(14px,0);opacity:.9} 60%{transform:translate(-6px,0)} 100%{transform:translate(3px,0);opacity:.45} }
      @keyframes rise { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }
      @keyframes fade { from { opacity:0; } to { opacity:1; } }
      @media (prefers-reduced-motion: reduce) { .pkt,.ghost-a,.ghost-b,.main,.sub { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="260" fill="#060408"/>
  <rect width="1200" height="260" fill="url(#glow)"/>

  <!-- red de nodos -->
  <g class="net">
    <line x1="60" y1="60" x2="210" y2="140"/><line x1="210" y1="140" x2="120" y2="220"/>
    <line x1="210" y1="140" x2="265" y2="58"/><line x1="265" y1="58" x2="250" y2="205"/>
    <line x1="1140" y1="60" x2="990" y2="130"/><line x1="990" y1="130" x2="1080" y2="215"/>
    <line x1="990" y1="130" x2="935" y2="55"/><line x1="935" y1="55" x2="950" y2="205"/>
    <circle cx="60" cy="60" r="3"/><circle cx="210" cy="140" r="4"/><circle cx="120" cy="220" r="3"/>
    <circle cx="265" cy="58" r="3"/><circle cx="250" cy="205" r="3"/>
    <circle cx="1140" cy="60" r="3"/><circle cx="990" cy="130" r="4"/><circle cx="1080" cy="215" r="3"/>
    <circle cx="935" cy="55" r="3"/><circle cx="950" cy="205" r="3"/>
  </g>
  <g fill="none">
    <path class="pkt" d="M60 60 L210 140 L265 58 L250 205"/>
    <path class="pkt p2" d="M1140 60 L990 130 L935 55 L950 205"/>
    <path class="pkt p3" d="M120 220 L210 140 L265 58"/>
  </g>

  <!-- título -->
  <g font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="104" text-anchor="middle">
    <text class="ghost-a" x="600" y="152" fill="#9966cc" textLength="560" lengthAdjust="spacingAndGlyphs">VASSAGO</text>
    <text class="ghost-b" x="600" y="152" fill="#3d0a6e" textLength="560" lengthAdjust="spacingAndGlyphs">VASSAGO</text>
    <text class="main" x="600" y="152" fill="url(#title)" textLength="560" lengthAdjust="spacingAndGlyphs">VASSAGO</text>
  </g>
  <rect class="sub" x="540" y="182" width="120" height="2" fill="#9966cc"/>
</svg>
