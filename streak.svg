<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1a0b2e"/></pattern>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7b2fbe"/><stop offset="50%" stop-color="#2d0050"/><stop offset="100%" stop-color="#7b2fbe"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9966cc" stop-opacity=".45"/><stop offset="100%" stop-color="#9966cc" stop-opacity="0"/></linearGradient>
<style>
